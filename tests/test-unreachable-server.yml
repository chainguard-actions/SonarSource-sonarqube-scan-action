name: Test analysis against unreachable server fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_HOST_URL: http://127.0.0.1:9
        with:
          skipSignatureVerification: "true"
          args: >-
            -Dsonar.host.url=http://127.0.0.1:9
            -Dsonar.projectKey=act-test
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when the SonarQube server is unreachable"
            exit 1
          fi
          echo "PASS"
