name: Test install scanner and run --help
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: --help
          skipSignatureVerification: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert sonar-scanner is on PATH
        run: |
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            echo "FAIL: sonar-scanner not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          SCANNER="$(command -v sonar-scanner)"
          echo "scanner: $SCANNER"
          case "$SCANNER" in
            *sonar-scanner-cli*8.4.0*) echo "PASS: default version installed in tool cache" ;;
            *) echo "FAIL: unexpected scanner location '$SCANNER'"; exit 1 ;;
          esac
