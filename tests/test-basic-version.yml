name: Test basic install and version-only run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: --version
          skipSignatureVerification: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert sonar-scanner is on PATH with default version
        run: |
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            echo "FAIL: sonar-scanner not found on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "sonar-scanner at: $(command -v sonar-scanner)"
          OUT="$(sonar-scanner --version 2>&1 || true)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "8.3.0.16463"; then
            echo "FAIL: expected default version 8.3.0.16463 in output"
            exit 1
          fi
          echo "PASS"
