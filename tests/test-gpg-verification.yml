name: Test install scanner with GPG signature verification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure gpg is installed
        run: |
          if ! command -v gpg >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO apt-get update -y
            $SUDO apt-get install -y gnupg dirmngr
          fi
          gpg --version
      - id: action
        uses: .
        with:
          args: --version
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - name: Assert sonar-scanner is installed
        run: |
          OUT="$(sonar-scanner -v 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "8.5.0.16571"; then
            echo "FAIL: expected scanner version 8.5.0.16571"
            exit 1
          fi
          echo "PASS"
