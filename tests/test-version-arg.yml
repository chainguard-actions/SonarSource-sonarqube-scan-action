name: Test install scanner and run with --version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: -v
          skipSignatureVerification: "true"
      - name: Assert action succeeded and scanner is on PATH
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            echo "FAIL: sonar-scanner not on PATH"
            exit 1
          fi
          OUT="$(sonar-scanner -v 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "8.1.0.6389"; then
            echo "FAIL: expected default scanner version 8.1.0.6389"
            exit 1
          fi
          echo "PASS"
