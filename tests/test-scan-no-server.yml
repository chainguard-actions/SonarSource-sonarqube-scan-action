name: Test scan with projectBaseDir against unreachable server fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_TOKEN: dummy-sonar-token
        with:
          projectBaseDir: tests/fixtures/sample-project
          skipSignatureVerification: "true"
          args: >
            -Dsonar.host.url=http://127.0.0.1:9
            -Dsonar.projectKey=act-test-project
      - name: Assert scan failed (no server reachable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because no SonarQube server is reachable"
            exit 1
          fi
          echo "PASS"
      - name: Assert scanner was installed before the scan
        run: |
          OUT="$(sonar-scanner -v 2>&1)"
          echo "$OUT"
          if ! echo "$OUT" | grep -q "8.5.0.16571"; then
            echo "FAIL: expected scanner 8.5.0.16571 to be installed on PATH"
            exit 1
          fi
          echo "PASS"
