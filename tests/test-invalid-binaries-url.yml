name: Test download failure from a bad scannerBinariesUrl
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure the chosen scanner version is not cached
        run: |
          rm -rf /opt/hostedtoolcache/sonar-scanner-cli/6.2.1-build.4610 || true
          rm -rf "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/sonar-scanner-cli/6.2.1-build.4610" || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          # A valid-format version that is not in the tool cache, so the
          # action has to download it from scannerBinariesUrl.
          scannerVersion: 6.2.1.4610
          scannerBinariesUrl: https://binaries.sonarsource.com/Distribution/this-path-does-not-exist
          skipSignatureVerification: "true"
          args: --version
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when binaries cannot be downloaded"
            exit 1
          fi
          echo "PASS"
