name: Test invalid scannerVersion fails sanity checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous output
        run: rm -f "$GITHUB_WORKSPACE/output.properties"
      - id: action
        uses: .
        continue-on-error: true
        with:
          skipSignatureVerification: "true"
          scannerVersion: "7.1.0; echo pwned"
        env:
          SONAR_HOST_URL: http://not_actually_used
          SONAR_SCANNER_JSON_PARAMS: '{"sonar.scanner.internal.dumpToFile": "./output.properties"}'
      - name: Assert action failed and scanner was not run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid scannerVersion"
            exit 1
          fi
          if [ -f ./output.properties ]; then
            echo "FAIL: scanner should not have run"
            exit 1
          fi
          echo "PASS"
