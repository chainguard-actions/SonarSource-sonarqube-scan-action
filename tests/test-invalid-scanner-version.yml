name: Test invalid scannerVersion fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          scannerVersion: "1.2.3"
          skipSignatureVerification: "true"
          args: --help
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid scannerVersion"
            exit 1
          fi
          echo "PASS"
      - name: Assert scanner was not installed
        run: |
          if command -v sonar-scanner >/dev/null 2>&1; then
            echo "FAIL: sonar-scanner should not be installed"
            exit 1
          fi
          echo "PASS"
