name: Test projectBaseDir with Maven project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Maven project dir
        run: |
          mkdir -p sample-maven
          echo '<project></project>' > sample-maven/pom.xml
      - id: action
        uses: .
        with:
          projectBaseDir: sample-maven/
          args: -v
          skipSignatureVerification: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          command -v sonar-scanner || { echo "FAIL: sonar-scanner not on PATH"; exit 1; }
          echo "PASS"
