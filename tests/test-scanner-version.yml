name: Test scannerVersion input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Clean previous output
        run: rm -f "$GITHUB_WORKSPACE/output.properties"
      - id: action
        uses: .
        with:
          skipSignatureVerification: "true"
          scannerVersion: 6.1.0.4477
        env:
          SONAR_HOST_URL: http://not_actually_used
          SONAR_SCANNER_JSON_PARAMS: '{"sonar.scanner.internal.dumpToFile": "./output.properties"}'
      - name: Assert requested scanner version installed and run
        run: |
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            echo "FAIL: sonar-scanner not found in PATH"
            exit 1
          fi
          SCANNER_PATH="$(command -v sonar-scanner)"
          echo "scanner path: $SCANNER_PATH"
          case "$SCANNER_PATH" in
            *6.1.0*) ;;
            *) echo "FAIL: expected scanner 6.1.0 in tool cache path"; exit 1 ;;
          esac
          if [ ! -f ./output.properties ]; then
            echo "FAIL: output.properties not produced"
            exit 1
          fi
          echo "PASS"
