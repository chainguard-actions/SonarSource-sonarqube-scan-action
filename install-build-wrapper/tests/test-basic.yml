name: Test basic install (default SonarQube Cloud host)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert build-wrapper binary installed
        env:
          BINARY: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "build-wrapper-binary: $BINARY"
          if [ -z "$BINARY" ]; then
            echo "FAIL: output build-wrapper-binary is empty"
            exit 1
          fi
          case "$BINARY" in
            /*) ;;
            *) echo "FAIL: expected absolute path"; exit 1 ;;
          esac
          case "$(basename "$BINARY")" in
            build-wrapper-*) ;;
            *) echo "FAIL: unexpected binary name"; exit 1 ;;
          esac
          if [ ! -f "$BINARY" ]; then
            echo "FAIL: binary does not exist"
            exit 1
          fi
          if [ ! -x "$BINARY" ]; then
            echo "FAIL: binary is not executable"
            exit 1
          fi
          echo "PASS"
      - name: Assert build-wrapper directory added to PATH
        env:
          BINARY: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          DIR="$(dirname "$BINARY")"
          echo "PATH: $PATH"
          case ":$PATH:" in
            *":$DIR:"*) echo "PASS: $DIR on PATH" ;;
            *) echo "FAIL: $DIR not on PATH"; exit 1 ;;
          esac
