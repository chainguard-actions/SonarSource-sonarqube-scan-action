name: Test basic install from SonarQube Cloud
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert build-wrapper-binary output points to an executable
        env:
          BIN: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "build-wrapper-binary: $BIN"
          if [ -z "$BIN" ]; then
            echo "FAIL: output is empty"
            exit 1
          fi
          case "$BIN" in
            /*) ;;
            *) echo "FAIL: output is not an absolute path"; exit 1 ;;
          esac
          if [ ! -f "$BIN" ]; then
            echo "FAIL: binary does not exist"
            exit 1
          fi
          if [ ! -x "$BIN" ]; then
            echo "FAIL: binary is not executable"
            exit 1
          fi
          case "$(basename "$BIN")" in
            build-wrapper*) ;;
            *) echo "FAIL: unexpected binary name"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert build wrapper directory is on PATH
        env:
          BIN: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          NAME="$(basename "$BIN")"
          echo "PATH: $PATH"
          if ! command -v "$NAME" >/dev/null 2>&1; then
            echo "FAIL: $NAME not found on PATH"
            exit 1
          fi
          echo "PASS: $(command -v "$NAME")"
