name: Test basic install of Build Wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert build-wrapper-binary output points to an executable
        env:
          ACTUAL: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: build-wrapper-binary output is empty"
            exit 1
          fi
          case "$ACTUAL" in
            /*) ;;
            *) echo "FAIL: expected an absolute path"; exit 1 ;;
          esac
          if [ ! -f "$ACTUAL" ]; then
            echo "FAIL: binary not found at $ACTUAL"
            exit 1
          fi
          if [ ! -x "$ACTUAL" ]; then
            echo "FAIL: binary at $ACTUAL is not executable"
            exit 1
          fi
          case "$(basename "$ACTUAL")" in
            build-wrapper*) ;;
            *) echo "FAIL: unexpected binary name $(basename "$ACTUAL")"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert build wrapper directory was added to PATH
        env:
          ACTUAL: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          NAME="$(basename "$ACTUAL")"
          echo "PATH: $PATH"
          FOUND="$(command -v "$NAME" || true)"
          echo "found: $FOUND"
          if [ -z "$FOUND" ]; then
            echo "FAIL: $NAME not found on PATH"
            exit 1
          fi
          echo "PASS"
