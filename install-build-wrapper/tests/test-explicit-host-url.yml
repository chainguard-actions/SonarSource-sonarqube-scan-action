name: Test install with explicit SONAR_HOST_URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Assert build-wrapper binary installed
        env:
          BINARY: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "build-wrapper-binary: $BINARY"
          if [ -z "$BINARY" ] || [ ! -f "$BINARY" ] || [ ! -x "$BINARY" ]; then
            echo "FAIL: binary missing or not executable"
            exit 1
          fi
          echo "PASS"
