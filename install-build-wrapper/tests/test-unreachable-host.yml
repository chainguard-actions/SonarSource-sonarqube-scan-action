name: Test install fails with unreachable SONAR_HOST_URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          SONAR_HOST_URL: http://127.0.0.1:1
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BINARY: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "binary: $BINARY"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when host is unreachable"
            exit 1
          fi
          echo "PASS"
