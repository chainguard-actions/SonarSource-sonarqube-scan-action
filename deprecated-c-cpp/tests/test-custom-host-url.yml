name: Test explicit SONAR_HOST_URL is preserved
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: https://sonarcloud.io/
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-binaries: 'false'
      - name: Assert SONAR_HOST_URL preserved and outputs set
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          echo "scanner=$SCANNER wrapper=$WRAPPER"
          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io/" ]; then
            echo "FAIL: SONAR_HOST_URL was overwritten"
            exit 1
          fi
          if [ ! -x "$SCANNER" ] || [ ! -x "$WRAPPER" ]; then
            echo "FAIL: binaries missing"
            exit 1
          fi
          echo "PASS"
