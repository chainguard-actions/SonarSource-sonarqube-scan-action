name: Test install without cache to custom path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          installation-path: .sonar-custom/tools
          cache-binaries: 'false'
      - name: Assert outputs point to installed executables
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "sonar-scanner-binary: $SCANNER"
          echo "build-wrapper-binary: $WRAPPER"
          for b in "$SCANNER" "$WRAPPER"; do
            if [ -z "$b" ]; then echo "FAIL: empty output"; exit 1; fi
            case "$b" in
              /*) ;;
              *) echo "FAIL: '$b' is not absolute"; exit 1 ;;
            esac
            case "$b" in
              *"/.sonar-custom/tools/"*) ;;
              *) echo "FAIL: '$b' not under custom installation path"; exit 1 ;;
            esac
            if [ ! -f "$b" ] || [ ! -x "$b" ]; then
              echo "FAIL: '$b' is not an executable file"; exit 1
            fi
          done
          case "$SCANNER" in */bin/sonar-scanner) ;; *) echo "FAIL: unexpected scanner path"; exit 1 ;; esac
          case "$(basename "$WRAPPER")" in build-wrapper*) ;; *) echo "FAIL: unexpected wrapper name"; exit 1 ;; esac
          echo "PASS"
      - name: Assert env and PATH updated
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ]; then
            echo "FAIL: SONAR_HOST_URL not defaulted to sonarcloud"; exit 1
          fi
          command -v sonar-scanner || { echo "FAIL: sonar-scanner not on PATH"; exit 1; }
          ls "$GITHUB_WORKSPACE/.sonar-custom/tools"
          echo "PASS"
