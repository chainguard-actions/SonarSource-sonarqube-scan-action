name: Test basic install (no cache)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-binaries: 'false'
      - name: Assert outputs point to executable binaries
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "sonar-scanner-binary: $SCANNER"
          echo "build-wrapper-binary: $WRAPPER"
          for f in "$SCANNER" "$WRAPPER"; do
            if [ -z "$f" ]; then echo "FAIL: empty output"; exit 1; fi
            case "$f" in /*) ;; *) echo "FAIL: '$f' not absolute"; exit 1;; esac
            if [ ! -x "$f" ]; then echo "FAIL: '$f' not an executable file"; exit 1; fi
          done
          case "$SCANNER" in */.sonar/*) ;; *) echo "FAIL: scanner not under .sonar"; exit 1;; esac
          case "$WRAPPER" in */.sonar/*) ;; *) echo "FAIL: wrapper not under .sonar"; exit 1;; esac
          echo "PASS"
      - name: Assert SONAR_HOST_URL defaulted and binaries on PATH
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ]; then
            echo "FAIL: SONAR_HOST_URL not defaulted"; exit 1
          fi
          echo "PATH=$PATH"
          if ! command -v sonar-scanner >/dev/null; then echo "FAIL: sonar-scanner not on PATH"; exit 1; fi
          if ! command -v "$(basename "$WRAPPER")" >/dev/null; then echo "FAIL: build-wrapper not on PATH"; exit 1; fi
          echo "PASS"
