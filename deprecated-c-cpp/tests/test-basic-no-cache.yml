name: Test basic usage without cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-binaries: 'false'
      - name: Assert outputs point to executable binaries
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "sonar-scanner-binary: $SCANNER"
          echo "build-wrapper-binary: $WRAPPER"
          if [ -z "$SCANNER" ] || [ -z "$WRAPPER" ]; then
            echo "FAIL: outputs are empty"
            exit 1
          fi
          case "$SCANNER" in /*) ;; *) echo "FAIL: scanner path not absolute"; exit 1 ;; esac
          case "$WRAPPER" in /*) ;; *) echo "FAIL: wrapper path not absolute"; exit 1 ;; esac
          if [ ! -x "$SCANNER" ]; then
            echo "FAIL: sonar-scanner binary not executable/found"
            exit 1
          fi
          if [ ! -x "$WRAPPER" ]; then
            echo "FAIL: build-wrapper binary not executable/found"
            exit 1
          fi
          case "$SCANNER" in "$GITHUB_WORKSPACE"/.sonar/*|*/.sonar/*) ;; *) echo "FAIL: scanner not under default .sonar dir"; exit 1 ;; esac
          case "$WRAPPER" in */.sonar/*) ;; *) echo "FAIL: wrapper not under default .sonar dir"; exit 1 ;; esac
          echo "PASS"
      - name: Assert PATH and SONAR_HOST_URL set
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ]; then
            echo "FAIL: expected SONAR_HOST_URL=https://sonarcloud.io"
            exit 1
          fi
          if ! command -v sonar-scanner >/dev/null 2>&1; then
            echo "FAIL: sonar-scanner not on PATH"
            exit 1
          fi
          if ! ls $(echo "$PATH" | tr ':' ' ') 2>/dev/null | grep -q '^build-wrapper-linux'; then
            echo "FAIL: build-wrapper not on PATH"
            exit 1
          fi
          echo "PASS"
