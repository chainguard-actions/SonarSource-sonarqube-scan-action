name: Test basic install without cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-binaries: 'false'
      - name: Assert outputs
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "sonar-scanner-binary: $SCANNER"
          echo "build-wrapper-binary: $WRAPPER"
          if [ -z "$SCANNER" ] || [ ! -f "$SCANNER" ] || [ ! -x "$SCANNER" ]; then
            echo "FAIL: sonar-scanner binary missing or not executable"
            exit 1
          fi
          if [ -z "$WRAPPER" ] || [ ! -f "$WRAPPER" ] || [ ! -x "$WRAPPER" ]; then
            echo "FAIL: build-wrapper binary missing or not executable"
            exit 1
          fi
          case "$SCANNER" in
            /*/.sonar/*) ;;
            *) echo "FAIL: scanner not under default .sonar dir"; exit 1 ;;
          esac
          case "$WRAPPER" in
            /*/.sonar/*) ;;
            *) echo "FAIL: build-wrapper not under default .sonar dir"; exit 1 ;;
          esac
          echo "PASS"
      - name: Assert SONAR_HOST_URL defaulted and binaries on PATH
        run: |
          echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ]; then
            echo "FAIL: expected SONAR_HOST_URL=https://sonarcloud.io"
            exit 1
          fi
          if ! command -v sonar-scanner >/dev/null; then
            echo "FAIL: sonar-scanner not on PATH"
            echo "PATH=$PATH"
            exit 1
          fi
          echo "PASS"
