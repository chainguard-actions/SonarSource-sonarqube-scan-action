name: Test custom installation path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          installation-path: custom-sonar-tools/nested
          cache-binaries: 'false'
      - name: Assert binaries installed under custom path
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "sonar-scanner-binary: $SCANNER"
          echo "build-wrapper-binary: $WRAPPER"
          EXPECTED_DIR="$(realpath custom-sonar-tools/nested)"
          echo "expected dir: $EXPECTED_DIR"
          if [ ! -d "$EXPECTED_DIR" ]; then
            echo "FAIL: installation path not created"
            exit 1
          fi
          case "$SCANNER" in "$EXPECTED_DIR"/*) ;; *) echo "FAIL: scanner not under custom path"; exit 1 ;; esac
          case "$WRAPPER" in "$EXPECTED_DIR"/*) ;; *) echo "FAIL: wrapper not under custom path"; exit 1 ;; esac
          if [ ! -f "$SCANNER" ] || [ ! -f "$WRAPPER" ]; then
            echo "FAIL: binaries missing"
            exit 1
          fi
          echo "PASS"
