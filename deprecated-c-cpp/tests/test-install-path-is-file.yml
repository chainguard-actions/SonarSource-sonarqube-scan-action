name: Test installation path that is a regular file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a file where the install dir should be
        run: echo "not a directory" > "$GITHUB_WORKSPACE/not-a-dir"
      - id: action
        uses: .
        continue-on-error: true
        with:
          installation-path: not-a-dir
          cache-binaries: 'false'
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
        run: |
          echo "outcome: $OUTCOME"
          echo "scanner: $SCANNER"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when installation path is a file"; exit 1
          fi
          if [ -n "$SCANNER" ]; then
            echo "FAIL: output should not be set"; exit 1
          fi
          echo "PASS"
