name: Test default inputs with cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert outputs
        env:
          SCANNER: ${{ steps.action.outputs.sonar-scanner-binary }}
          WRAPPER: ${{ steps.action.outputs.build-wrapper-binary }}
        run: |
          echo "sonar-scanner-binary: $SCANNER"
          echo "build-wrapper-binary: $WRAPPER"
          for b in "$SCANNER" "$WRAPPER"; do
            if [ -z "$b" ] || [ ! -x "$b" ]; then
              echo "FAIL: binary '$b' missing or not executable"
              exit 1
            fi
          done
          echo "PASS"
